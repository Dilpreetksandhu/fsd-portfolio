<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>
  <link rel="stylesheet" href="about.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      
  background-color: #121212;
  color: #f5f4f7;
  padding: 2rem;
  min-height: 100vh;
  overflow-y: auto;
  transition: background 0.3s ease, color 0.3s ease;
  /* allows vertical scrolling */
}

body.light {
  background-color: #f4f4f4;
  color: #111111;
}
    

.container {
  max-width: 600px;
  margin: auto;
  background: #000000;
  padding: 2rem;
  border-radius: 10px;
}

body.light .container {
  background: #ffffff;
  color: #111111;
}

input, textarea {
  background: #1e1e1e;
  color: #ffffff;
}

body.light input,
body.light textarea {
  background: #ffffff;
  color: #111111;
  border: 1px solid #ccc;
}

.toggle-btn .theme-btn {
  position: absolute;
    top: 2rem;
    left:40rem;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: inherit;
}

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #f8f3f3;
      border-radius: 6px;
      resize: vertical;
    }

    .container button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #f12e6c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #ee4d80;
    }

    .back-home {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #f2f2f2;
      color: #bfb2b2;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s ease;
    }

    .back-home:hover {
      background-color: #000000;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #555;
    }

    .footer span {
      color: red;
    }

    /* Base styles (already good for desktop) */

/* Make inputs and buttons fluid */
input, textarea, button {
  width: 100%;
  font-size: 1rem;
}

/* Responsive typography */
h1 {
  font-size: 2rem;
}

/* Media Queries */

/* Small devices (phones) */
@media (max-width: 480px) {
  body {
    padding: 1rem;
  }

  .container {
    padding: 1rem;
  }

  h1 {
    font-size: 1.5rem;
  }

  input, textarea {
    font-size: 0.9rem;
    padding: 0.6rem;
  }

  button {
    font-size: 0.9rem;
    padding: 0.6rem;
  }
}

/* Medium devices (tablets) */
@media (max-width: 768px) {
  .container {
    width: 90%;
    padding: 1.5rem;
  }

  h1 {
    font-size: 1.75rem;
  }
}

/* Large devices (desktops) */
@media (min-width: 1024px) {
  .container {
    max-width: 700px;
  }
}

  </style>
</head>
<body>
 <div class="toggle-btn">
  <button id="theme-toggle" class="theme-btn">☀️</button>
 </div>
  <div class="container">
    
    <h1>Contact Me</h1>
    <form id="contact-form"> 
      <label for="name">Your Name</label>
     <input type="text" id="name" name="name" required /> 
     <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required />
       <label for="message">Your Message</label>
       <textarea id="message" name="message" rows="6" required></textarea> 
      <button type="submit">Send Message</button> 
      
      
    </form> 
    <a href="index.html">
      <button onclick="">Back to Home page</button> 
    </a>
      </div> 
      
      <!-- Load EmailJS SDK FIRST --> <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>


      <!-- Then load your external JS --> <script src="contact.js"></script>
    
    
  </div>


</body>
</html>
